[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maharit"
version = "0.1.0"
description = "Python client for MaharitDB graph database"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["graph", "database", "cypher", "maharitdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/Moto1829/maharit-db"
Repository = "https://github.com/Moto1829/maharit-db"
Documentation = "https://Moto1829.github.io/maharit-db"

[tool.hatch.build.targets.wheel]
packages = ["maharit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
