site_name: MaharitDB ドキュメント
site_description: 高性能グラフデータベース - Cypher クエリ対応
site_url: https://moto1829.github.io/maharit-db/
repo_url: https://github.com/Moto1829/maharit-db
repo_name: Moto1829/maharit-db

docs_dir: docs

# _i18n/ は翻訳用の用語集・スタイルガイド（サイトには出さない）
exclude_docs: |
  _i18n/

theme:
  name: material
  custom_dir: overrides
  # language は i18n プラグインが言語ごとに設定する（reconfigure_material）
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy


# 英語版: mkdocs-static-i18n の suffix 構成。foo.md（日本語・正本）の隣に foo.en.md を置く。
# 日本語は従来どおり /、英語は /en/ に出力。英語版が無いページは日本語版を表示する。
# nav の見出しを追加・変更したら nav_translations も更新すること。
hooks:
  - overrides/hooks/i18n_freshness.py

plugins:
  - search:
      lang: [ja, en]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ja
          default: true
          name: 日本語
          build: true
        - locale: en
          name: English
          build: true
          site_name: MaharitDB Documentation
          site_description: High-performance graph database with Cypher queries
          nav_translations:
            ホーム: Home
            クイックスタート: Quick start
            アーキテクチャ: Architecture
            Cypher クエリ言語: Cypher query language
            基本構文: Basic syntax
            WHERE 句・フィルタリング: WHERE clause and filtering
            FOREACH / サブクエリ: FOREACH / subqueries
            パラメータ（$param 構文）: Parameters ($param syntax)
            関数リファレンス: Function reference
            文字列関数: String functions
            数学関数: Math functions
            リスト操作: List operations
            述語関数: Predicate functions
            集計関数: Aggregate functions
            全文検索関数: Full-text search functions
            テンポラル型関数: Temporal functions
            インデックス・制約: Indexes and constraints
            プロパティインデックス: Property indexes
            全文検索インデックス: Full-text indexes
            スキーマ制約: Schema constraints
            サーバー・運用: Server and operations
            サーバー設定: Server configuration
            TLS/SSL 設定: TLS/SSL
            認証・ロール管理: Authentication and roles
            アクセス制御（ACL）: Access control (ACL)
            メトリクス・ヘルスチェック: Metrics and health checks
            ログ: Logging
            バックアップ・リストア: Backup and restore
            Docker での使用: Docker
            高度なトピック: Advanced topics
            トランザクション: Transactions
            レプリケーション: Replication
            シャーディング: Sharding
            クエリ最適化（EXPLAIN / PROFILE）: Query optimization (EXPLAIN / PROFILE)
            並列化とパフォーマンス: Parallelism and performance
            API リファレンス: API reference
            Rust クライアント: Rust client
            Python クライアント: Python client
            TCP プロトコル仕様: TCP protocol
            グラフアルゴリズム: Graph algorithms
            最短経路: Shortest paths
            全経路探索: All paths
            PageRank / 中心性指標: PageRank and centrality
            連結成分: Connected components
            サイクル検出: Cycle detection
            可視化: Visualization
            Web アプリ: Web app
            DOT / SVG エクスポート: DOT / SVG export
            ASCII テキスト可視化: ASCII visualization

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - ホーム: index.md
  - クイックスタート: quickstart.md
  - アーキテクチャ: architecture.md
  - Cypher クエリ言語:
    - cypher/index.md
    - 基本構文: cypher/basics.md
    - WHERE 句・フィルタリング: cypher/where.md
    - SET / REMOVE / MERGE: cypher/set-remove-merge.md
    - UNWIND / WITH / UNION: cypher/unwind-with-union.md
    - FOREACH / サブクエリ: cypher/foreach-subquery.md
    - ORDER BY / LIMIT / SKIP: cypher/order-limit-skip.md
    - パラメータ（$param 構文）: cypher/parameters.md
  - 関数リファレンス:
    - functions/index.md
    - 文字列関数: functions/string.md
    - 数学関数: functions/math.md
    - リスト操作: functions/list.md
    - 述語関数: functions/predicates.md
    - 集計関数: functions/aggregation.md
    - 全文検索関数: functions/fulltext.md
    - テンポラル型関数: functions/temporal.md
  - インデックス・制約:
    - indexes/index.md
    - プロパティインデックス: indexes/property-index.md
    - 全文検索インデックス: indexes/fulltext-index.md
    - スキーマ制約: indexes/constraints.md
  - サーバー・運用:
    - operations/index.md
    - サーバー設定: operations/server-config.md
    - TLS/SSL 設定: operations/tls.md
    - 認証・ロール管理: operations/auth.md
    - アクセス制御（ACL）: operations/acl.md
    - メトリクス・ヘルスチェック: operations/metrics.md
    - ログ: operations/tracing.md
    - バックアップ・リストア: operations/backup.md
    - Docker での使用: operations/docker.md
  - 高度なトピック:
    - advanced/index.md
    - トランザクション: advanced/transactions.md
    - レプリケーション: advanced/replication.md
    - シャーディング: advanced/sharding.md
    - クエリ最適化（EXPLAIN / PROFILE）: advanced/query-optimization.md
    - 並列化とパフォーマンス: advanced/parallelization.md
  - API リファレンス:
    - api/index.md
    - Rust クライアント: api/rust-client.md
    - Python クライアント: api/python-client.md
    - TCP プロトコル仕様: api/protocol.md
  - グラフアルゴリズム:
    - algorithms/index.md
    - 最短経路: algorithms/shortest-path.md
    - 全経路探索: algorithms/all-paths.md
    - PageRank / 中心性指標: algorithms/centrality.md
    - 連結成分: algorithms/connected-components.md
    - サイクル検出: algorithms/cycle-detection.md
  - 可視化:
    - visualization/index.md
    - Web アプリ: visualization/web-app.md
    - DOT / SVG エクスポート: visualization/export.md
    - ASCII テキスト可視化: visualization/ascii.md
