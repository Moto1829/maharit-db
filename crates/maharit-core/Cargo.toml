[package]
name = "maharit-core"
description = "Core graph data structures for MaharitDB"
version.workspace = true
edition.workspace = true
license.workspace = true

# japanese: 日本語形態素解析(lindera + 埋め込み IPADIC 辞書)を有効化。
# 辞書が無圧縮でバイナリに埋め込まれ、リリースバイナリが約 2.7MB → 約 49MB になるため既定では off。
# ビルド時に辞書の元データをダウンロードする。LINDERA_BUILD_DICTIONARY_CACHE_DIR でキャッシュ可。
# 日本語全文検索が必要なビルドのみ `--features maharit-core/japanese` で有効化する。
[features]
default = []
japanese = ["dep:lindera"]

[dependencies]
dashmap.workspace = true
thiserror.workspace = true
lindera = { version = "6.2", features = ["embed-ipadic"], optional = true }
rayon = "1.10"
serde.workspace = true
