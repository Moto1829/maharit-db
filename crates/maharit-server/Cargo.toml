[package]
name = "maharit-server"
description = "CLI and server for MaharitDB"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maharit"
path = "src/main.rs"

# japanese: 日本語形態素解析(埋め込み IPADIC 辞書 約15MB)を同梱する。
# 既定 off。日本語全文検索が必要なリリースのみ
# `cargo build --release -p maharit-server --features japanese` で有効化する。
[features]
default = []
japanese = ["maharit-core/japanese"]

[dependencies]
maharit-core.workspace = true
maharit-storage.workspace = true
maharit-query.workspace = true
maharit-cluster = { path = "../maharit-cluster" }
rustyline.workspace = true
colored.workspace = true
tokio.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
