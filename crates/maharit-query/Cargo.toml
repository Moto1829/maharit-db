[package]
name = "maharit-query"
description = "Query parser and executor for MaharitDB"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
maharit-core.workspace = true
thiserror.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
rayon = "1.10"
serde_json.workspace = true
# 深く入れ子にした式でスタックを使い切らないよう、再帰の途中でスタックを伸ばす
stacker = "0.1"

[dev-dependencies]
# ベンチ専用。グラフ描画（plotters）と rayon は使わないので既定の feature を外す。
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
