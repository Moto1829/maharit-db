<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaharitDB Visualizer</title>

    <link
      href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_midnight.min.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>

    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #181c24;
        --panel-2: #1f2530;
        --border: #2a303c;
        --text: #e6e8ec;
        --muted: #8a93a6;
        --accent: #5aa9ff;
        --accent-2: #4a8ad8;
        --error: #ff6b6b;
        --ok: #51cf66;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
          "Meiryo", sans-serif;
        display: grid;
        grid-template-rows: auto auto 1fr;
      }
      header {
        padding: 10px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      h1 { font-size: 16px; margin: 0; font-weight: 600; }
      .meta { color: var(--muted); font-size: 12px; margin-left: auto; }

      .editor {
        padding: 12px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      textarea {
        width: 100%;
        min-height: 80px;
        max-height: 200px;
        background: #0d1014;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 13px;
        resize: vertical;
      }
      .controls {
        margin-top: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        background: var(--accent);
        color: #0a0d12;
        border: 0;
        border-radius: 4px;
        padding: 8px 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: var(--accent-2); color: var(--text); }
      button:disabled { opacity: 0.6; cursor: progress; }
      .hint { color: var(--muted); font-size: 12px; }
      .status { color: var(--muted); font-size: 12px; margin-left: auto; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--error); }

      .results-wrap {
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
        min-height: 0;
      }
      .tabs {
        display: flex;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 0 16px;
      }
      .tab {
        padding: 10px 14px;
        cursor: pointer;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        font-size: 13px;
      }
      .tab.active {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .panel {
        display: none;
        overflow: auto;
        min-height: 0;
        background: var(--bg);
      }
      .panel.active { display: block; }
      #table-panel, #graph-panel { height: 100%; }
      #graph-panel { position: relative; }
      #graph-canvas { width: 100%; height: 100%; background: #0d1014; }

      /* Graph 要素の詳細パネル */
      #graph-detail {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 300px;
        max-height: calc(100% - 24px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 10;
      }
      #graph-detail.open { display: flex; }
      .detail-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: var(--panel-2);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .detail-kind {
        text-transform: uppercase;
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 0.5px;
        padding: 2px 6px;
        border-radius: 3px;
        background: var(--accent);
        color: #0a0d12;
      }
      .detail-kind.edge { background: #b489ff; }
      .detail-title {
        flex: 1;
        color: var(--text);
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .detail-close {
        background: transparent;
        color: var(--muted);
        border: 0;
        padding: 0 4px;
        font-size: 16px;
        cursor: pointer;
      }
      .detail-close:hover { color: var(--text); background: transparent; }
      .detail-body {
        padding: 8px 12px 12px;
        overflow-y: auto;
        font-size: 12px;
      }
      .detail-section {
        margin-top: 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
      }
      .detail-row {
        display: grid;
        grid-template-columns: minmax(80px, 30%) 1fr;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .detail-key {
        color: var(--muted);
        font-family: ui-monospace, Menlo, monospace;
        word-break: break-all;
      }
      .detail-value {
        color: var(--text);
        font-family: ui-monospace, Menlo, monospace;
        word-break: break-all;
      }
      .detail-value.null { color: #555; font-style: italic; }
      .detail-empty {
        color: var(--muted);
        padding: 8px 0;
        font-style: italic;
      }

      /* クエリ履歴ドロップダウン */
      .history-wrapper { position: relative; }
      #history-button {
        background: var(--panel-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      #history-button:hover { background: var(--border); color: var(--text); }
      #history-dropdown {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        min-width: 360px;
        max-width: 520px;
        max-height: 320px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        display: none;
        flex-direction: column;
        z-index: 20;
        overflow: hidden;
      }
      #history-dropdown.open { display: flex; }
      .history-list {
        overflow-y: auto;
        flex: 1;
      }
      .history-item {
        padding: 8px 12px;
        cursor: pointer;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .history-item:hover { background: var(--panel-2); }
      .history-query {
        color: var(--text);
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .history-meta {
        color: var(--muted);
        font-size: 10px;
      }
      .history-empty {
        padding: 16px;
        color: var(--muted);
        text-align: center;
        font-size: 12px;
        font-style: italic;
      }
      .history-footer {
        padding: 8px 12px;
        background: var(--panel-2);
        border-top: 1px solid var(--border);
        text-align: right;
      }
      .history-clear {
        background: transparent;
        color: var(--error);
        border: 0;
        font-size: 11px;
        cursor: pointer;
        padding: 0;
      }
      .history-clear:hover { background: transparent; text-decoration: underline; }
      .history-clear:disabled { opacity: 0.4; cursor: default; text-decoration: none; }
      #raw-panel pre {
        margin: 0;
        padding: 16px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .empty {
        color: var(--muted);
        padding: 24px;
        text-align: center;
      }
      .error-box {
        margin: 16px;
        padding: 12px;
        background: rgba(255, 107, 107, 0.08);
        border: 1px solid rgba(255, 107, 107, 0.4);
        border-radius: 4px;
        color: var(--error);
        white-space: pre-wrap;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 12px;
      }

      /* Tabulator dark overrides */
      .tabulator { background: var(--bg); border: none; font-size: 13px; }
      .tabulator-header { background: var(--panel-2) !important; }
      .tabulator-row { background: var(--bg) !important; }
      .tabulator-row.tabulator-row-even { background: #12161e !important; }
    </style>
  </head>
  <body>
    <header>
      <h1>MaharitDB Visualizer</h1>
      <span class="meta" id="meta">connecting…</span>
    </header>

    <section class="editor">
      <textarea
        id="query"
        spellcheck="false"
        placeholder="例: MATCH (n)-[r]->(m) RETURN n.id, n.name, r.type, m.id, m.name"
      ></textarea>
      <div class="controls">
        <button id="run">Run query</button>
        <div class="history-wrapper">
          <button id="history-button" type="button">History ▾</button>
          <div id="history-dropdown" role="menu">
            <div class="history-list" id="history-list"></div>
            <div class="history-footer">
              <button id="history-clear" class="history-clear" type="button">履歴クリア</button>
            </div>
          </div>
        </div>
        <span class="hint">Ctrl/⌘+Enter で実行</span>
        <span class="status" id="status"></span>
      </div>
    </section>

    <section class="results-wrap">
      <nav class="tabs" role="tablist">
        <div class="tab active" data-tab="table" role="tab">Table</div>
        <div class="tab" data-tab="graph" role="tab">Graph</div>
        <div class="tab" data-tab="raw" role="tab">Raw JSON</div>
      </nav>
      <div id="table-panel" class="panel active">
        <div id="table-host" style="height: 100%;"></div>
      </div>
      <div id="graph-panel" class="panel">
        <div id="graph-canvas"></div>
        <aside id="graph-detail" aria-hidden="true">
          <header class="detail-header">
            <span class="detail-kind" id="detail-kind">NODE</span>
            <span class="detail-title" id="detail-title">—</span>
            <button class="detail-close" id="detail-close" aria-label="close">×</button>
          </header>
          <div class="detail-body" id="detail-body"></div>
        </aside>
      </div>
      <div id="raw-panel" class="panel">
        <pre id="raw-content"></pre>
      </div>
    </section>

    <script>
      const $ = (id) => document.getElementById(id);
      const meta = $("meta"),
        statusEl = $("status"),
        run = $("run"),
        query = $("query"),
        rawContent = $("raw-content"),
        tableHost = $("table-host"),
        tablePanel = $("table-panel"),
        graphPanel = $("graph-panel"),
        rawPanel = $("raw-panel"),
        graphCanvas = $("graph-canvas");

      let tabulator = null;
      let cy = null;
      let lastResponse = null;

      fetch("/api/info")
        .then((r) => r.json())
        .then((info) => {
          meta.textContent = `server: ${info.server_addr}  ·  viz: v${info.version}`;
        })
        .catch(() => {
          meta.textContent = "server: (unknown)";
        });

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => switchTab(tab.dataset.tab));
      });
      run.addEventListener("click", runQuery);
      query.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "Enter") runQuery();
      });

      function switchTab(name) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.toggle("active", t.dataset.tab === name));
        tablePanel.classList.toggle("active", name === "table");
        graphPanel.classList.toggle("active", name === "graph");
        rawPanel.classList.toggle("active", name === "raw");
        if (name === "graph" && cy) cy.resize();
        if (name === "table" && tabulator) tabulator.redraw(true);
      }

      async function runQuery() {
        const q = query.value.trim();
        if (!q) return;
        run.disabled = true;
        statusEl.textContent = "running…";
        statusEl.className = "status";
        try {
          const resp = await fetch("/api/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q }),
          });
          const body = await resp.json();
          lastResponse = body;
          rawContent.textContent = JSON.stringify(body, null, 2);
          if (!resp.ok || body.error) {
            renderError(body.error || `HTTP ${resp.status}`);
            statusEl.className = "status err";
            statusEl.textContent = "error";
          } else {
            renderTable(body);
            renderGraph(body);
            statusEl.className = "status ok";
            statusEl.textContent = `${body.rows.length} rows · ${body.elapsed_ms} ms`;
            pushHistory(q);
          }
        } catch (e) {
          renderError(String(e));
          statusEl.className = "status err";
          statusEl.textContent = "network error";
        } finally {
          run.disabled = false;
        }
      }

      function renderTable({ columns, rows }) {
        tableHost.innerHTML = "";
        if (!rows.length) {
          tableHost.innerHTML = '<div class="empty">0 rows</div>';
          tabulator = null;
          return;
        }
        const tabCols = columns.map((c) => ({
          title: c,
          field: c,
          headerFilter: "input",
          formatter: (cell) => {
            const v = cell.getValue();
            return v === null || v === undefined
              ? '<span style="color:#666">null</span>'
              : escapeHtml(String(v));
          },
        }));
        tabulator = new Tabulator(tableHost, {
          data: rows,
          columns: tabCols,
          // 列名 "n.id" の "." をネストパスとして解釈させない
          // (Cypher の RETURN n.id は文字通り "n.id" というキー名で返る)
          nestedFieldSeparator: false,
          layout: "fitDataStretch",
          pagination: true,
          paginationSize: 50,
          paginationSizeSelector: [25, 50, 100, 250],
          height: "100%",
          movableColumns: true,
          reactiveData: false,
        });
      }

      function renderError(msg) {
        tableHost.innerHTML = `<div class="error-box">${escapeHtml(msg)}</div>`;
        graphCanvas.innerHTML = "";
        if (cy) { cy.destroy(); cy = null; }
        tabulator = null;
      }

      /**
       * 行データからノード／エッジを推定してグラフ描画する。
       *
       * 推定ルール:
       *  - "<prefix>.id" 列があれば、その prefix をノードグループとみなす
       *    (例: n.id, n.name → ノード "n", id を識別子に)
       *  - 2 つのノードグループが同一行にあればエッジを生成
       *    (相互接続は MATCH (a)-[r]->(b) RETURN a.id, b.id, r.type 形式を想定)
       */
      function renderGraph({ columns, rows }) {
        graphCanvas.innerHTML = "";
        if (cy) { cy.destroy(); cy = null; }

        const groups = detectNodeGroups(columns);
        if (groups.length === 0 || !rows.length) {
          graphCanvas.innerHTML =
            '<div class="empty">グラフ表示には "&lt;prefix&gt;.id" を含むクエリが必要です。<br>例: MATCH (n)-[r]->(m) RETURN n.id, n.name, r.type, m.id, m.name</div>';
          return;
        }

        const nodes = new Map(); // nodeId -> cytoscape element
        const edges = [];
        // エッジ用のプロパティ集約: 行ごとに r.* / rel.* / その他「ノード以外」のキーを集める
        const edgePropPrefixes = collectEdgePrefixes(columns, groups);

        for (const row of rows) {
          const present = [];
          for (const g of groups) {
            const id = stripQuotes(row[`${g}.id`]);
            if (id === undefined || id === null || id === "") continue;
            const nodeId = `${g}:${id}`;
            present.push({ group: g, id, nodeId });
            if (!nodes.has(nodeId)) {
              const labelCandidates = ["name", "title", "label"];
              let label = id;
              for (const k of labelCandidates) {
                const v = stripQuotes(row[`${g}.${k}`]);
                if (v) { label = v; break; }
              }
              nodes.set(nodeId, {
                data: {
                  id: nodeId,
                  label: `${label}`,
                  group: g,
                  kind: "node",
                  properties: collectPrefixedProps(row, `${g}.`),
                },
              });
            }
          }
          if (present.length >= 2) {
            const edgeLabel = pickEdgeLabel(row, columns);
            // エッジ側プロパティ: r.* など、ノードグループ以外の prefix を集める
            const edgeProps = {};
            for (const p of edgePropPrefixes) {
              Object.assign(edgeProps, collectPrefixedProps(row, `${p}.`));
            }
            for (let i = 0; i < present.length - 1; i++) {
              const a = present[i], b = present[i + 1];
              edges.push({
                data: {
                  id: `${a.nodeId}->${b.nodeId}:${edges.length}`,
                  source: a.nodeId,
                  target: b.nodeId,
                  label: edgeLabel || "",
                  kind: "edge",
                  properties: edgeProps,
                },
              });
            }
          }
        }

        if (nodes.size === 0) {
          graphCanvas.innerHTML =
            '<div class="empty">グラフデータが見つかりませんでした (id が空または null)</div>';
          return;
        }

        cy = cytoscape({
          container: graphCanvas,
          elements: [...nodes.values(), ...edges],
          style: [
            {
              selector: "node",
              style: {
                "background-color": "#5aa9ff",
                label: "data(label)",
                color: "#e6e8ec",
                "font-size": "11px",
                "text-valign": "center",
                "text-halign": "center",
                "text-outline-color": "#0f1115",
                "text-outline-width": 2,
                width: 36,
                height: 36,
              },
            },
            {
              selector: "edge",
              style: {
                width: 2,
                "line-color": "#4a8ad8",
                "target-arrow-color": "#4a8ad8",
                "target-arrow-shape": "triangle",
                "curve-style": "bezier",
                label: "data(label)",
                "font-size": "10px",
                color: "#8a93a6",
                "text-rotation": "autorotate",
                "text-margin-y": -8,
              },
            },
          ],
          layout: { name: "cose", animate: false, fit: true, padding: 30 },
        });

        // ノード／エッジクリックで詳細パネルを表示
        cy.on("tap", "node", (evt) => showDetail(evt.target.data()));
        cy.on("tap", "edge", (evt) => showDetail(evt.target.data()));
        cy.on("tap", (evt) => {
          if (evt.target === cy) hideDetail();
        });
        hideDetail();
      }

      function detectNodeGroups(columns) {
        const groups = new Set();
        for (const c of columns) {
          const m = c.match(/^([A-Za-z_][A-Za-z0-9_]*)\.id$/);
          if (m) groups.add(m[1]);
        }
        return [...groups];
      }

      function collectPrefixedProps(row, prefix) {
        const out = {};
        for (const [k, v] of Object.entries(row)) {
          if (k.startsWith(prefix)) {
            out[k.slice(prefix.length)] = stripQuotes(v);
          }
        }
        return out;
      }

      function collectEdgePrefixes(columns, nodeGroups) {
        const nodeSet = new Set(nodeGroups);
        const prefixes = new Set();
        for (const c of columns) {
          const m = c.match(/^([A-Za-z_][A-Za-z0-9_]*)\./);
          if (m && !nodeSet.has(m[1])) prefixes.add(m[1]);
        }
        return [...prefixes];
      }

      function pickEdgeLabel(row, columns) {
        for (const c of columns) {
          if (/\.(type|label|name)$/.test(c) && !/^([A-Za-z_][A-Za-z0-9_]*)\.id$/.test(c)) {
            const v = stripQuotes(row[c]);
            // ノード側ではないエッジっぽい列名を採用 (簡易ヒューリスティック)
            if (v && (c.startsWith("r.") || c.startsWith("rel.") || c.includes("edge"))) {
              return v;
            }
          }
        }
        return "";
      }

      const detailPanel = $("graph-detail"),
        detailKind = $("detail-kind"),
        detailTitle = $("detail-title"),
        detailBody = $("detail-body"),
        detailClose = $("detail-close");

      detailClose.addEventListener("click", hideDetail);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") hideDetail();
      });

      function showDetail(data) {
        const isEdge = data.kind === "edge";
        detailKind.textContent = isEdge ? "EDGE" : "NODE";
        detailKind.classList.toggle("edge", isEdge);
        detailTitle.textContent = data.label || data.id || "(unnamed)";

        const sections = [];
        if (isEdge) {
          sections.push({
            title: "Edge",
            rows: [
              ["id", data.id],
              ["source", data.source],
              ["target", data.target],
              ["label", data.label || ""],
            ],
          });
        } else {
          sections.push({
            title: "Node",
            rows: [
              ["id", data.id],
              ["group", data.group || ""],
              ["label", data.label || ""],
            ],
          });
        }

        const props = data.properties || {};
        const propRows = Object.entries(props).sort(([a], [b]) =>
          a.localeCompare(b)
        );
        sections.push({ title: "Properties", rows: propRows });

        detailBody.innerHTML = sections
          .map((s) => {
            const head = `<div class="detail-section">${escapeHtml(s.title)}</div>`;
            if (!s.rows.length) {
              return head + '<div class="detail-empty">(no values)</div>';
            }
            const body = s.rows
              .map(([k, v]) => {
                const nullish = v === null || v === undefined || v === "";
                const valHtml = nullish
                  ? '<span class="detail-value null">null</span>'
                  : `<span class="detail-value">${escapeHtml(String(v))}</span>`;
                return `<div class="detail-row"><span class="detail-key">${escapeHtml(
                  String(k)
                )}</span>${valHtml}</div>`;
              })
              .join("");
            return head + body;
          })
          .join("");

        detailPanel.classList.add("open");
        detailPanel.setAttribute("aria-hidden", "false");
      }

      function hideDetail() {
        detailPanel.classList.remove("open");
        detailPanel.setAttribute("aria-hidden", "true");
      }

      function stripQuotes(v) {
        if (v === null || v === undefined) return v;
        const s = String(v);
        if (s.length >= 2 && s.startsWith('"') && s.endsWith('"')) {
          return s.slice(1, -1);
        }
        return s;
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // ===== クエリ履歴 (localStorage) =====
      const HISTORY_KEY = "maharit-viz:query-history";
      const HISTORY_LIMIT = 10;

      const historyButton = $("history-button"),
        historyDropdown = $("history-dropdown"),
        historyList = $("history-list"),
        historyClear = $("history-clear");

      function loadHistory() {
        try {
          const raw = localStorage.getItem(HISTORY_KEY);
          if (!raw) return [];
          const arr = JSON.parse(raw);
          return Array.isArray(arr) ? arr : [];
        } catch {
          return [];
        }
      }

      function saveHistory(items) {
        try {
          localStorage.setItem(HISTORY_KEY, JSON.stringify(items));
        } catch (e) {
          // クォータ超過などは無視
          console.warn("history save failed", e);
        }
      }

      function pushHistory(q) {
        const trimmed = q.trim();
        if (!trimmed) return;
        const items = loadHistory().filter((e) => e.query !== trimmed);
        items.unshift({ query: trimmed, timestamp: Date.now() });
        if (items.length > HISTORY_LIMIT) items.length = HISTORY_LIMIT;
        saveHistory(items);
        if (historyDropdown.classList.contains("open")) renderHistory();
      }

      function clearHistory() {
        if (!confirm("クエリ履歴をすべて削除しますか？")) return;
        try { localStorage.removeItem(HISTORY_KEY); } catch {}
        renderHistory();
      }

      function formatRelativeTime(ts) {
        const diff = Date.now() - ts;
        const s = Math.floor(diff / 1000);
        if (s < 60) return `${s} 秒前`;
        const m = Math.floor(s / 60);
        if (m < 60) return `${m} 分前`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h} 時間前`;
        const d = Math.floor(h / 24);
        return `${d} 日前`;
      }

      function previewQuery(q) {
        const oneLine = q.replace(/\s+/g, " ").trim();
        return oneLine.length > 80 ? oneLine.slice(0, 77) + "…" : oneLine;
      }

      function renderHistory() {
        const items = loadHistory();
        historyClear.disabled = items.length === 0;
        if (items.length === 0) {
          historyList.innerHTML = '<div class="history-empty">履歴がありません</div>';
          return;
        }
        historyList.innerHTML = items
          .map(
            (it, idx) =>
              `<div class="history-item" data-idx="${idx}" role="menuitem">` +
              `<span class="history-query">${escapeHtml(previewQuery(it.query))}</span>` +
              `<span class="history-meta">${escapeHtml(formatRelativeTime(it.timestamp))}</span>` +
              `</div>`
          )
          .join("");
      }

      historyButton.addEventListener("click", (e) => {
        e.stopPropagation();
        const open = historyDropdown.classList.toggle("open");
        if (open) renderHistory();
      });

      historyList.addEventListener("click", (e) => {
        const item = e.target.closest(".history-item");
        if (!item) return;
        const items = loadHistory();
        const idx = Number(item.dataset.idx);
        if (Number.isInteger(idx) && items[idx]) {
          query.value = items[idx].query;
          query.focus();
          historyDropdown.classList.remove("open");
        }
      });

      historyClear.addEventListener("click", (e) => {
        e.stopPropagation();
        clearHistory();
      });

      document.addEventListener("click", (e) => {
        if (
          !historyDropdown.contains(e.target) &&
          e.target !== historyButton
        ) {
          historyDropdown.classList.remove("open");
        }
      });
    </script>
  </body>
</html>
