<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MaharitDB Visualizer</title>

    <link
      href="https://unpkg.com/tabulator-tables@6.3.0/dist/css/tabulator_midnight.min.css"
      rel="stylesheet"
    />
    <link href="/styles.css" rel="stylesheet" />

    <script src="https://unpkg.com/tabulator-tables@6.3.0/dist/js/tabulator.min.js"></script>
    <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <!-- 認証有効時のログイン画面 (デフォルトは非表示) -->
    <div id="login-overlay" hidden>
      <form id="login-form" class="login-card">
        <h2>MaharitDB Visualizer</h2>
        <p class="login-hint">サーバーに認証が必要です</p>
        <label>
          ユーザー名
          <input type="text" id="login-username" autocomplete="username" required />
        </label>
        <label>
          パスワード
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button type="submit">ログイン</button>
        <p class="login-error" id="login-error"></p>
      </form>
    </div>

    <header>
      <h1>MaharitDB Visualizer</h1>
      <span class="role-badge" id="role-badge" hidden></span>
      <span class="meta" id="meta">connecting…</span>
      <button id="logout-button" class="logout-button" type="button" hidden>ログアウト</button>
    </header>

    <section class="editor">
      <textarea
        id="query"
        spellcheck="false"
        placeholder="例: MATCH (n)-[r]->(m) RETURN n.id, n.name, r.type, m.id, m.name"
      ></textarea>
      <div class="controls">
        <button id="run">Run query</button>
        <div class="history-wrapper">
          <button id="history-button" type="button">History ▾</button>
          <div id="history-dropdown" role="menu">
            <div class="history-list" id="history-list"></div>
            <div class="history-footer">
              <button id="history-clear" class="history-clear" type="button">履歴クリア</button>
            </div>
          </div>
        </div>
        <span class="hint">Ctrl/⌘+Enter で実行</span>
        <span class="status" id="status"></span>
      </div>
    </section>

    <section class="results-wrap">
      <nav class="tabs" role="tablist">
        <div class="tab active" data-tab="table" role="tab">Table</div>
        <div class="tab" data-tab="graph" role="tab">Graph</div>
        <div class="tab" data-tab="raw" role="tab">Raw JSON</div>
      </nav>
      <div id="table-panel" class="panel active">
        <div id="table-host" style="height: 100%;"></div>
      </div>
      <div id="graph-panel" class="panel">
        <div id="graph-canvas"></div>
        <aside id="graph-detail" aria-hidden="true">
          <header class="detail-header">
            <span class="detail-kind" id="detail-kind">NODE</span>
            <span class="detail-title" id="detail-title">—</span>
            <button class="detail-close" id="detail-close" aria-label="close">×</button>
          </header>
          <div class="detail-body" id="detail-body"></div>
        </aside>
      </div>
      <div id="raw-panel" class="panel">
        <pre id="raw-content"></pre>
      </div>
    </section>
  </body>
</html>
