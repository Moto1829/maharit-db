title: MaharitDB ドキュメント
description: 高性能グラフデータベース - Cypher クエリ対応
theme: just-the-docs

lang: ja
url: "https://moto1829.github.io"
baseurl: "/maharit-db"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 2

# Navigation footer
nav_footer_custom_links:
  - title: GitHub
    url: https://github.com/Moto1829/maharit-db

# Color scheme
color_scheme: nil

# Heading anchors
heading_anchors: true

# Aux links
aux_links:
  "GitHubで見る":
    - "https://github.com/Moto1829/maharit-db"

# Enable callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: 重要
    color: blue
  new:
    title: 新機能
    color: green
  note:
    title: ノート
    color: purple
  warning:
    title: 警告
    color: red

# Disable Liquid processing for all pages (Cypher queries contain {{ }} syntax)
defaults:
  - scope:
      path: ""
    values:
      render_with_liquid: false

plugins:
  - jekyll-seo-tag

exclude:
  - "*.toml"
  - "docker.md"
