services:
  # REPL mode (interactive)
  maharit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maharit-db
    volumes:
      - maharit-data:/data
    environment:
      - MAHARIT_DATA_DIR=/data
    # Interactive mode for REPL
    stdin_open: true
    tty: true

  # Server mode (TCP server)
  maharit-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maharit-db-server
    command: ["/app/maharit", "server", "--host", "0.0.0.0", "--port", "7687", "--data", "/data/maharit.db"]
    volumes:
      - maharit-data:/data
    environment:
      - MAHARIT_DATA=/data/maharit.db
    ports:
      - "7687:7687"
      - "9090:9090"

  # Visualization Web app (HTTP frontend over maharit-server)
  maharit-viz:
    build:
      context: .
      dockerfile: Dockerfile.viz
    container_name: maharit-db-viz
    command: ["/app/maharit-viz", "--bind", "0.0.0.0:8080", "--server", "maharit-server:7687", "--assets", "/app/assets"]
    depends_on:
      maharit-server:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info

volumes:
  maharit-data:
    driver: local
