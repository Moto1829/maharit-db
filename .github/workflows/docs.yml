name: Deploy Docs to GitHub Pages

# 日本語（/）と英語（/en/）の docs をビルドする（mkdocs-static-i18n）。
# PR ではビルド（--strict）のみ行い、main への push / 手動実行のときだけデプロイする。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check_docs_i18n.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/check_docs_i18n.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 翻訳の鮮度チェックと「古い翻訳」の注意書きに git の履歴が要る
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs (pinned)
        run: pip install -r requirements-docs.txt

      - name: Check translation freshness
        # 日本語だけが更新された英語ページを警告する（まだ失敗にはしない。
        # source_commit が無い・不正なときだけ失敗）。結果はジョブのサマリーに出る。
        run: python3 scripts/check_docs_i18n.py --github

      - name: Build MkDocs (ja + en)
        # --strict: 壊れたリンクや設定の誤りを警告ではなく失敗にする
        run: mkdocs build --strict --site-dir _site

      - uses: actions/configure-pages@v4
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
