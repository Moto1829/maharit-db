name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'todo/**'
      - 'todo-archive/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'todo/**'
      - 'todo-archive/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned (keep in sync with rust-toolchain.toml) so that a new Rust
      # release cannot break CI without a code change.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy (workspace)
        # --workspace is required: the root Cargo.toml is also a package, so
        # without it only the root package's targets are linted.
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (workspace)
        # Includes the leader/follower differential test, the concurrency
        # stress test and the Cypher conformance table.
        run: cargo test --workspace

  soak:
    # Extra seeds for the randomized tests. Runs on main / manual only and in
    # parallel with the other jobs; PRs still run the default seeds via
    # `cargo test` above.
    name: soak (randomized tests, more seeds)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Replication diff (15 seeds)
        run: MAHARIT_DIFF_SEEDS=$(seq -s, 1 15) cargo test -p maharit-server leader_and_follower_converge
      - name: Concurrency stress (5 seeds)
        run: |
          for seed in $(seq 1 5); do
            MAHARIT_STRESS_SEED=$seed MAHARIT_STRESS_OPS=300 \
              cargo test -p maharit-server concurrent_mixed_workload
          done

  e2e:
    name: E2E (single server + replication cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release binary
        run: cargo build --release -p maharit-server
      - name: Run E2E suites
        # Replication runs 3 times: a flaky failure is treated as a bug.
        env:
          E2E_LOG_DIR: ${{ runner.temp }}/maharit-e2e
        run: bash scripts/run_e2e_local.sh --replication-runs 3
      - name: Upload E2E logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: ${{ runner.temp }}/maharit-e2e
          retention-days: 7
