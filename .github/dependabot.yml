version: 2
updates:
  # Security updates are opened individually as advisories appear; these
  # are the weekly version updates, grouped to keep the PR count low.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/clients/python-native"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
