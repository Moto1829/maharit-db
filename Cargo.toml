[workspace]
resolver = "2"
members = [
    "crates/maharit-core",
    "crates/maharit-storage",
    "crates/maharit-query",
    "crates/maharit-server",
    "crates/maharit-io",
    "crates/maharit-viz",
    "crates/maharit-client",
    "crates/maharit-cluster",
]

# 配布バイナリ(maharit)のサイズ削減: strip + LTO + サイズ優先最適化 + panic=abort
# catch_unwind/panic hook は未使用のため panic="abort" は安全。
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/suzukishimei/maharit-db"

[workspace.dependencies]
maharit-core = { path = "crates/maharit-core" }
maharit-storage = { path = "crates/maharit-storage" }
maharit-query = { path = "crates/maharit-query" }
maharit-io = { path = "crates/maharit-io" }
maharit-viz = { path = "crates/maharit-viz" }
maharit-client = { path = "crates/maharit-client" }
dashmap = "6"
thiserror = "2"
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
csv = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
colored = "2"
regex = "1"
tokio = { version = "1", features = ["full"] }
bytes = "1"
flate2 = "1"
zstd = "0.13"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "0.26"
unicode-normalization = "0.1"
toml = "0.8"
tokio-tungstenite = "0.24"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
getrandom = "0.2"
pbkdf2 = "0.12"
sha2 = "0.10"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
tower-cookies = "0.10"
axum-server = { version = "0.7", features = ["tls-rustls"] }

[package]
name = "maharit-db"
version.workspace = true
edition.workspace = true

[dependencies]
maharit-core.workspace = true
maharit-storage.workspace = true
maharit-query.workspace = true
maharit-io.workspace = true
maharit-viz.workspace = true

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "traversal"
path = "examples/traversal.rs"

[[example]]
name = "persistence"
path = "examples/persistence.rs"

[[example]]
name = "io"
path = "examples/io.rs"

[[example]]
name = "visualization"
path = "examples/visualization.rs"

[[example]]
name = "algorithms"
path = "examples/algorithms.rs"
